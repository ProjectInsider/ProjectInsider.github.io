<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectInsider Beta</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 12px;
    }

    body {
      background: #008080;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .window {
      width: 470px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
      padding: 3px;
    }

    .titlebar {
      height: 24px;
      background: #000080;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 2px 3px 2px 6px;
      font-weight: bold;
      user-select: none;
    }

    .titlebar-button,
    .button {
      font-family: inherit;
      background: #c0c0c0;
      color: #000000;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    }

    .titlebar-button {
      width: 20px;
      height: 18px;
      padding: 0;
      font-size: 12px;
      line-height: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .window-content {
      min-height: 170px;
      padding: 28px 24px 18px;
      color: #000000;
    }

    .message {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .icon {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      background: #ffffff;
      border: 2px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000080;
      font-size: 24px;
      font-family: Georgia, serif;
      font-weight: bold;
      font-style: italic;
    }

    .message-text {
      padding-top: 3px;
      line-height: 1.5;
    }

    .message-text strong {
      display: block;
      margin-bottom: 6px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .button {
      min-width: 82px;
      height: 26px;
      padding: 2px 14px;
      cursor: pointer;
    }

    .button:active,
    .titlebar-button:active {
      border-top: 2px solid #000000;
      border-left: 2px solid #000000;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
    }

    .button:focus {
      outline: 1px dotted #000000;
      outline-offset: -5px;
    }

    @media (max-width: 540px) {
      .window { width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span>ProjectInsider Beta</span>
      <button class="titlebar-button" type="button" aria-label="Close" onclick="closeSite()">×</button>
    </div>

    <div class="window-content">
      <div class="message">
        <div class="icon">i</div>
        <div class="message-text">
          <strong>Beta notice</strong>
          This website is currently in beta.<br>
          Some features may be unfinished or unavailable.<br><br>
          Click OK to continue to ProjectInsider.
        </div>
      </div>

      <div class="buttons">
        <button class="button" type="button" onclick="enterSite()">OK</button>
      </div>
    </div>
  </div>

  <script>
    function enterSite() {
      window.location.href = "main.html";
    }

    function closeSite() {
      window.close();
      setTimeout(function () {
        window.location.replace("about:blank");
      }, 50);
    }
  </script>
</body>
</html>
