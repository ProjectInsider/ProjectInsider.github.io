<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProjectInsider</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 12px;
    }

    body {
      background: #008080;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .window {
      width: 430px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
      padding: 3px;
    }

    .titlebar {
      height: 24px;
      background: #000080;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 2px 6px;
      font-weight: bold;
    }

    .content {
      min-height: 150px;
      padding: 28px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">ProjectInsider</div>
    <div class="content">
      <b>Welcome to ProjectInsider.</b><br><br>
      Main page placeholder.<br>
      Windows 95 environment under construction.
    </div>
  </div>
</body>
</html>
