<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MetroStore Downloads</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: "MS Sans Serif", Tahoma, Arial, sans-serif;
      font-size: 12px;
    }

    body {
      background: #008080;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .window {
      width: 760px;
      max-width: calc(100vw - 24px);
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
      padding: 3px;
    }

    .titlebar {
      height: 24px;
      background: #000080;
      color: #ffffff;
      display: flex;
      align-items: center;
      padding: 2px 6px;
      font-weight: bold;
      user-select: none;
    }

    .content {
      padding: 24px 24px 28px;
    }

    .heading {
      margin-bottom: 5px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
    }

    .subtitle {
      margin-bottom: 24px;
      text-align: center;
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .version {
      min-width: 0;
      padding: 10px;
      text-align: center;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #808080;
      border-bottom: 2px solid #808080;
    }

    .logo-frame {
      width: 92px;
      height: 92px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
    }

    .logo {
      width: 60px;
      height: 60px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 3px;
      transform: skewY(-7deg);
    }

    .logo span:nth-child(1) { background: #ff0000; }
    .logo span:nth-child(2) { background: #00a000; }
    .logo span:nth-child(3) { background: #0000d0; }
    .logo span:nth-child(4) { background: #ffff00; }

    .version-title {
      margin-bottom: 4px;
      font-weight: bold;
      font-size: 15px;
    }

    .system {
      min-height: 30px;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .download {
      width: 100%;
      height: 28px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 12px;
      background: #c0c0c0;
      color: #000000;
      border-top: 2px solid #ffffff;
      border-left: 2px solid #ffffff;
      border-right: 2px solid #000000;
      border-bottom: 2px solid #000000;
      box-shadow: inset -1px -1px 0 #808080, inset 1px 1px 0 #dfdfdf;
      cursor: pointer;
    }

    .download:active {
      border-top: 2px solid #000000;
      border-left: 2px solid #000000;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      box-shadow: inset 1px 1px 0 #808080, inset -1px -1px 0 #dfdfdf;
    }

    .download:focus {
      outline: 1px dotted #000000;
      outline-offset: -5px;
    }

    @media (max-width: 680px) {
      html, body { overflow: auto; }
      body { align-items: flex-start; padding: 12px 0; }
      .versions { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">MetroStore Downloads</div>

    <div class="content">
      <div class="heading">Choose your MetroStore version</div>
      <div class="subtitle">Select the version made for your Windows release.</div>

      <div class="versions">
        <div class="version">
          <div class="logo-frame">
            <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="version-title">MetroStore 1.0</div>
          <div class="system">Windows 8</div>
          <button class="download" type="button" onclick="comingSoon('MetroStore 1.0 for Windows 8')">Download</button>
        </div>

        <div class="version">
          <div class="logo-frame">
            <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="version-title">MetroStore 2.0</div>
          <div class="system">Windows 8.1</div>
          <button class="download" type="button" onclick="comingSoon('MetroStore 2.0 for Windows 8.1')">Download</button>
        </div>

        <div class="version">
          <div class="logo-frame">
            <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="version-title">MetroStore 2.5</div>
          <div class="system">Windows 10 Beta</div>
          <button class="download" type="button" onclick="comingSoon('MetroStore 2.5 for Windows 10 Beta')">Download</button>
        </div>

        <div class="version">
          <div class="logo-frame">
            <div class="logo" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
          </div>
          <div class="version-title">MetroStore 3.0</div>
          <div class="system">Windows 10 RTM</div>
          <button class="download" type="button" onclick="comingSoon('MetroStore 3.0 for Windows 10 RTM')">Download</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function comingSoon(version) {
      alert(version + '\n\nDownload is not available yet.');
    }
  </script>
</body>
</html>
